# A release: a tag v<version> on main. The checks run again for the tag, the packages are built
# with the tag's version, and the release is made with the gh CLI - its title is the tag, its notes
# the changelog's section, its assets the packages and their SHA-256 files (the names openccu-lite's
# catalogue resolves).
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: release
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: The tag is the manifest's version and has its changelog entry
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test "$(jq -r .version addon/openccu-lite.json)" = "$VERSION" || { echo "the manifest's version is not $VERSION"; exit 1; }
          grep -q "^## \[$VERSION\]" CHANGELOG.md || { echo "CHANGELOG.md has no entry for $VERSION"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - run: scripts/build.sh
      - run: scripts/check-package.sh dist/shell-x86_64-$VERSION.tar.gz dist/shell-aarch64-$VERSION.tar.gz
      - name: The release notes are the changelog's section
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[" { on = ($0 ~ "^## \\[" v "\\]"); next } on' CHANGELOG.md > notes.md
          test -s notes.md
          cat notes.md
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
