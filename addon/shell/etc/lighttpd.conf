# etc/lighttpd.conf of lite-addon-shell (MIT): openccu-lite proxies /addons/shell/ to the daemon on
# the loopback, WebSocket upgrades included (the terminal), and serves the 503 page while it is not
# running.
$HTTP["url"] == "/addons/shell" {
    url.redirect = ("" => "/addons/shell/")
}
$HTTP["url"] =~ "^/addons/shell/" {
    proxy.server = ("/addons/shell/" => (("host" => "127.0.0.1", "port" => 8290)))
    proxy.header = ("upgrade" => "enable")
    server.errorfile-prefix = "/usr/local/addons/shell/www/lighttpd-error-"
}
